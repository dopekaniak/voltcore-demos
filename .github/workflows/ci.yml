name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: sw, POSTGRES_PASSWORD: sw, POSTGRES_DB: shapewright_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sw" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://sw:sw@localhost:5432/shapewright_test
      TEST_DATABASE_URL: postgresql://sw:sw@localhost:5432/shapewright_test
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-0123456789abcdef0123456789abcdef
      FAST_CHECK_RUNS: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:test:prepare
      - run: pnpm test
