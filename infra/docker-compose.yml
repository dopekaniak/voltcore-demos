# Local infrastructure. `pnpm dev` runs the Node apps on the host; this file provides the
# backing services. The mesh container ships no slicer (rule 6, ADR-002b).
name: shapewright
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sw
      POSTGRES_PASSWORD: sw
      POSTGRES_DB: shapewright
    ports: ["5432:5432"]
    volumes: ["pg:/var/lib/postgresql/data", "./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sw"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shapewright
      MINIO_ROOT_PASSWORD: shapewright-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  mesh:
    build: ../apps/mesh
    environment:
      MESH_SERVICE_TOKEN: dev-mesh-service-token
    ports: ["8000:8000"]
volumes:
  pg: {}
  minio: {}
